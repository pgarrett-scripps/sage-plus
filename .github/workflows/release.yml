name: Release Sage Plus

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  RUST_MUSL_IMAGE: rust:1.97.1-alpine3.22
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version and tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            release_version="$(bash scripts/check-release-version.sh "$GITHUB_REF_NAME")"
            release_tag="$GITHUB_REF_NAME"
          else
            release_version="$(bash scripts/check-release-version.sh)"
            release_tag="v$release_version"
          fi
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            builder: native
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            builder: alpine
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: native
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            builder: alpine
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            builder: native
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            builder: native
          - runner: macos-15
            target: aarch64-apple-darwin
            builder: native
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        if: matrix.builder == 'native'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Compile native release binaries
        if: matrix.builder == 'native'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}
      - name: Compile native musl release binaries
        if: matrix.builder == 'alpine'
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env "CARGO_TARGET_DIR=/workspace/target/${{ matrix.target }}" \
            "$RUST_MUSL_IMAGE" \
            sh -euxc '
              apk add --no-cache cmake make musl-dev perl
              cargo build --release --workspace --locked
            '
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="sage-plus-${{ needs.verify.outputs.release_tag }}-${{ matrix.target }}"
          mkdir -p "$archive"
          cp README.md DOCS.md LICENSE "$archive/"
          cp "target/${{ matrix.target }}/release/sage" "$archive/"
          cp "target/${{ matrix.target }}/release/sage-mcp" "$archive/"
          tar czf "$archive.tar.gz" "$archive"
          echo "ASSET=$archive.tar.gz" >> "$GITHUB_ENV"
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: bash
        run: |
          archive="sage-plus-${{ needs.verify.outputs.release_tag }}-${{ matrix.target }}"
          mkdir -p "$archive"
          cp README.md DOCS.md LICENSE "$archive/"
          cp "target/${{ matrix.target }}/release/sage.exe" "$archive/"
          cp "target/${{ matrix.target }}/release/sage-mcp.exe" "$archive/"
          7z a "$archive.zip" "$archive"
          echo "ASSET=$archive.zip" >> "$GITHUB_ENV"
      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release assets
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum sage-plus-* > SHA256SUMS
      - name: Upload complete release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Build AMD64 container
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download static Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-x86_64-unknown-linux-musl
          path: .release/input
      - name: Prepare minimal Docker context
        run: |
          archive="sage-plus-${{ needs.verify.outputs.release_tag }}-x86_64-unknown-linux-musl"
          tar xzf ".release/input/$archive.tar.gz" -C .release/input
          mkdir -p .release/docker/target/x86_64-unknown-linux-musl/release
          cp Dockerfile .release/docker/
          cp ".release/input/$archive/sage" .release/docker/target/x86_64-unknown-linux-musl/release/
          cp ".release/input/$archive/sage-mcp" .release/docker/target/x86_64-unknown-linux-musl/release/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.release_tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(needs.verify.outputs.release_tag, '-') }}
      - name: Build and optionally push container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .release/docker
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [verify, assemble, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist
      - name: Create draft release if needed
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            create_args=(
              "$RELEASE_TAG"
              --verify-tag
              --draft
              --generate-notes
              --title "Sage Plus $RELEASE_TAG"
            )
            if [[ "$RELEASE_TAG" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi
      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Publish release
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=true --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
