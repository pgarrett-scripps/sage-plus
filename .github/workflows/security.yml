name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "19 9 * * 1"
  pull_request:
    paths:
      - Cargo.lock
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the complete lockfile against current advisories
        run: cargo audit --file Cargo.lock --deny unsound
