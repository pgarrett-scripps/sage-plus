name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check release version inheritance
        run: bash scripts/check-release-version.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build optimized binaries
        run: cargo build --release --workspace --locked

  test:
    name: Test Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", "1.97.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-${{ matrix.rust }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        # Build tests and examples once; the steps below reuse these binaries
        # instead of `cargo run -p ...`, which rebuilds with a different feature set.
        run: cargo build --workspace --all-targets --locked
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Test patched storage compatibility
        if: matrix.rust == '1.97.1'
        run: cargo test -p filemanager --locked
      - name: Test benchmark tooling
        if: matrix.rust == '1.97.1'
        run: python3 -m unittest discover -s benchmarks/tests -v
      - name: Run positional modification regression
        run: target/debug/examples/positional_modifications
      - name: Run named modification library regression
        run: python3 benchmarks/run_named_modifications.py --sage target/debug/sage
      - name: Run VAT1_HUMAN search
        run: target/debug/sage tests/config.json --disable-telemetry-i-dont-want-to-improve-sage
      - name: Run original synthetic fixture
        run: target/debug/sage tests/synthetic/config.json --output_directory target/synthetic-smoke --disable-telemetry-i-dont-want-to-improve-sage
      - name: Run with CLI args
        run: |
          target/debug/sage \
            -f tests/Q99536.fasta \
            -o foo \
            --annotate-matches \
            --write-pin \
            --disable-telemetry-i-dont-want-to-improve-sage \
            tests/config-cli.json \
            tests/*.mzML

  minimal:
    name: Test minimal features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: minimal
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test without default features
        run: cargo test --workspace --no-default-features --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1 with coverage tools
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@562f912bf8a1174eb1007c4afe216a9187a8d722 # cargo-llvm-cov
      - name: Enforce workspace line coverage
        run: cargo llvm-cov --workspace --locked --html --output-dir coverage --fail-under-lines 80
      - name: Export LCOV data
        run: cargo llvm-cov report --lcov --output-path coverage/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sage-coverage
          path: coverage
          if-no-files-found: warn

  platform-smoke:
    name: Smoke test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: smoke-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test minimal CLI and isolated MCP workers
        run: cargo test --locked --no-default-features -p sage-cli -p sage-mcp

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
