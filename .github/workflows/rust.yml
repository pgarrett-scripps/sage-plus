name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check release version inheritance
        run: bash scripts/check-release-version.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build optimized binaries
        run: cargo build --release --workspace --locked

  test:
    name: Test Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", "1.97.1"]

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Run tests
        run: cargo test --workspace --locked --verbose
      - name: Run VAT1_HUMAN search
        run: cargo run --locked -p sage-cli --bin sage -- tests/config.json
      - name: Run with CLI args
        run: |
          cargo run --locked -p sage-cli --bin sage -- \
            -f tests/Q99536.fasta \
            -o foo \
            --annotate-matches \
            --write-pin \
            --disable-telemetry-i-dont-want-to-improve-sage \
            tests/config-cli.json \
            tests/*.mzML

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.97.1 with coverage tools
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce workspace line coverage
        run: cargo llvm-cov --workspace --locked --html --output-dir coverage --fail-under-lines 80
      - name: Export LCOV data
        run: cargo llvm-cov report --lcov --output-path coverage/lcov.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sage-coverage
          path: coverage
          if-no-files-found: warn
