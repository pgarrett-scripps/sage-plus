name: Feature request
description: Suggest a new capability or a change to an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the existing
        [enhancement issues](https://github.com/pgarrett-scripps/sage-plus/labels/enhancement)
        first, and `FEATURES.md` for what Sage Plus already does beyond upstream Sage.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What analysis are you unable to do today? Describe the situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: >
        What Sage Plus would do instead. If it adds a configuration option, name it and say what
        its default should be.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Effect on existing searches
      description: >
        Every option must have a default that reproduces current behaviour, so an existing
        configuration keeps producing the same search. Say whether your proposal can meet that,
        and what changes for someone who does not set the new option.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other tools or workarounds you tried, and why they are not enough. If a published method
        describes this, cite it.
    validations:
      required: false

  - type: dropdown
    id: upstream
    attributes:
      label: Does this belong upstream?
      description: >
        Sage Plus is a downstream distribution and keeps its diff against upstream Sage small.
        A generally useful change is better contributed to upstream Sage.
      options:
        - It is specific to Sage Plus (a Sage Plus feature, reader or output)
        - It would suit upstream Sage, but I am asking here first
        - Not sure
    validations:
      required: true
