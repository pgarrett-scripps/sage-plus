[workspace]
members = [
    "crates/sage",
    "crates/sage-cli",
    "crates/sage-cloudpath",
    "crates/sage-glyco",
    "crates/sage-mcp",
]

exclude = ["vendor/filemanager"]

resolver = "2"

[workspace.package]
version = "0.1.0-beta.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[patch.crates-io]
filemanager = { path = "vendor/filemanager" }

# Debug test builds run real searches and Bruker decoding; unoptimized
# dependencies made those tests minutes long.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
