[workspace]
members = [
    "crates/sage",
    "crates/sage-cli",
    "crates/sage-cloudpath",
    "crates/sage-dia",
]

exclude = ["vendor/filemanager"]

resolver = "2"

[workspace.package]
version = "0.1.0-beta.9"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Optimized builds for local experiments and benchmarks-in-progress:
# `cargo build --profile fast-release`. Rebuilds after a code change take
# seconds instead of minutes; runtime is a few percent slower than `release`,
# which remains the profile for shipped binaries and published numbers.
[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

[patch.crates-io]
filemanager = { path = "vendor/filemanager" }

# Debug test builds run real searches and Bruker decoding; unoptimized
# dependencies made those tests minutes long.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
